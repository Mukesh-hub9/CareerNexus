<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0;url=index.html?tab=signin" />
  <title>Sign In — CareerNexus AI</title>
  <style>
    body {
      margin: 0;
      background: #070a12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="loader">
    <div class="spinner"></div>
    <div style="font-size:0.9rem;color:#94a3b8">Redirecting to CareerNexus Sign In...</div>
  </div>
  <script>
    window.location.replace('index.html?tab=signin');
  </script>
</body>

</html>
