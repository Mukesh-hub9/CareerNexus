<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — CareerNexus AI</title>
  <meta name="description" content="The page you are looking for does not exist on CareerNexus." />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <style>
    .not-found-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl);
      background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15), transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.1), transparent 50%),
                  var(--bg-primary);
    }
    .not-found-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: var(--space-lg);
    }
    .not-found-code {
      font-size: clamp(5rem, 12vw, 9rem);
      font-family: var(--font-display);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: var(--space-sm);
    }
  </style>
</head>
<body class="not-found-container">
  <div class="not-found-badge">
    <span>⚠️</span> Route Not Found
  </div>
  <div class="not-found-code text-gradient">404</div>
  <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:12px">Lost in the Nexus?</h1>
  <p style="color:var(--text-secondary);max-width:440px;margin-bottom:var(--space-2xl);line-height:1.6">
    The page or route you were looking for could not be located. Let's get you back on track to your career roadmap.
  </p>
  <div style="display:flex;gap:var(--space-md);flex-wrap:wrap;justify-content:center">
    <a href="index.html" class="btn btn-primary" style="padding:12px 24px">🏠 Return Home</a>
    <a href="dashboard.html" class="btn btn-secondary" style="padding:12px 24px">📊 Go to Dashboard</a>
  </div>
</body>
</html>
